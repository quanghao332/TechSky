<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soạn thảo Bất động sản | LanAnh Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR (Desktop) -->
        <aside class="w-64 bg-slate-900 text-white hidden lg:flex flex-col shadow-xl">
            <div class="h-16 flex items-center px-6 border-b border-slate-800 font-bold text-blue-500 text-xl">LanAnh Admin</div>
            <nav class="p-4">
                <a href="index.html" class="flex items-center gap-3 p-4 bg-slate-800/50 text-slate-300 rounded-xl hover:text-white transition-all">
                    <i class="ri-arrow-left-line text-lg"></i><span>Quay lại danh sách</span>
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header Mobile/Desktop -->
            <header class="h-16 bg-white border-b flex items-center px-6 sticky top-0 z-30 shadow-sm">
                <a href="index.html" class="lg:hidden mr-4 p-2 bg-slate-100 rounded-lg"><i class="ri-arrow-left-line"></i></a>
                <h1 id="page-title" class="text-lg font-bold text-slate-800">Thêm mới Bất động sản</h1>
            </header>

            <main class="flex-1 overflow-y-auto p-4 lg:p-8">
                <form id="bdsForm" class="max-w-5xl mx-auto space-y-6 pb-10">
                    
                    <!-- CARD: THÔNG TIN CƠ BẢN -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                        <h2 class="font-bold text-blue-600 flex items-center gap-2 mb-4">
                            <i class="ri-information-fill text-xl"></i> Thông tin cơ bản
                        </h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tiêu đề bài viết *</label>
                                <input type="text" id="title" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Giá niêm yết *</label>
                                <div class="flex relative">
                                    <input type="text" id="price" required placeholder="5 tỷ hoặc 15 triệu" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                    <span id="price-addon" class="hidden absolute right-4 top-3.5 text-xs font-bold text-slate-400">/THÁNG</span>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Loại hình</label>
                                <select id="type" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none appearance-none">
                                    <option value="Bán">Mua Bán</option>
                                    <option value="Thuê">Cho Thuê</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Diện tích (m²)</label>
                                <input type="number" id="area" min="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Giấy tờ pháp lý</label>
                                <select id="legal" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"></select>
                            </div>

                            <!-- PHÒNG NGỦ & WC (TRỞ LẠI) -->
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Số phòng ngủ</label>
                                <div class="relative">
                                    <input type="number" id="bed" min="0" placeholder="0" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                    <i class="ri-bed-line absolute left-4 top-3.5 text-slate-400"></i>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Số phòng tắm / WC</label>
                                <div class="relative">
                                    <input type="number" id="wc" min="0" placeholder="0" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                    <i class="ri-rest-room-line absolute left-4 top-3.5 text-slate-400"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CARD: VỊ TRÍ -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                        <h2 class="font-bold text-blue-600 flex items-center gap-2 mb-4"><i class="ri-map-pin-2-fill text-xl"></i> Vị trí BĐS</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <select id="province" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"><option value="">-- Tỉnh/Thành --</option></select>
                            <select id="district" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none disabled:opacity-50"><option value="">-- Quận/Huyện --</option></select>
                            <select id="ward" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none disabled:opacity-50"><option value="">-- Phường/Xã --</option></select>
                        </div>
                        <input type="text" id="street" placeholder="Số nhà, tên đường..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>

                    <!-- CARD: HÌNH ẢNH (Cloudinary) -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="font-bold text-blue-600 flex items-center gap-2 mb-4"><i class="ri-image-2-fill text-xl"></i> Album hình ảnh</h2>
                        <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl p-8 hover:border-blue-400 transition-colors bg-slate-50/50 cursor-pointer" onclick="document.getElementById('image_file').click()">
                            <i class="ri-upload-cloud-2-line text-4xl text-slate-300"></i>
                            <p class="text-sm font-semibold text-slate-500 mt-2">Nhấp để tải lên tối đa 5 ảnh</p>
                            <input type="file" id="image_file" multiple accept="image/*" class="hidden">
                        </div>
                        <div id="image_preview_container" class="grid grid-cols-2 sm:grid-cols-5 gap-4 mt-6"></div>
                        <input type="hidden" id="image_url">
                    </div>

                    <!-- CARD: MÔ TẢ -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="font-bold text-blue-600 flex items-center gap-2 mb-4"><i class="ri-file-text-fill text-xl"></i> Mô tả chi tiết</h2>
                        <textarea id="description" class="hidden"></textarea>
                    </div>

                    <!-- ACTIONS -->
                    <div class="flex items-center justify-end gap-4">
                        <a href="index.html" class="px-6 py-3 font-bold text-slate-500 hover:text-slate-800">Hủy</a>
                        <button type="submit" id="btn_submit" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-xl shadow-blue-600/20 transition-all flex items-center gap-2">
                            <i class="ri-save-line text-lg"></i> <span>Lưu bài viết</span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script>
        // TINYMCE
        tinymce.init({
            selector: '#description',
            height: 400,
            menubar: false,
            plugins: 'lists link image table code help wordcount',
            toolbar: 'bold italic underline | bullist numlist | link image | removeformat code',
            setup: (editor) => editor.on('change', () => tinymce.triggerSave())
        });

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        let selectedFiles = [];

        // UI LOGIC (GIÁ & PHÁP LÝ)
        const typeSelect = document.getElementById('type');
        const legalSelect = document.getElementById('legal');
        function toggleUI(type) {
            document.getElementById('price-addon').classList.toggle('hidden', type !== 'Thuê');
            legalSelect.innerHTML = type === 'Thuê' ? '<option>Hợp đồng thuê nhà</option>' : '<option>Sổ hồng riêng</option><option>Hợp đồng mua bán</option><option>Đang chờ sổ</option>';
        }
        typeSelect.onchange = (e) => toggleUI(e.target.value);
        toggleUI('Bán');

        // CLOUDINARY PREVIEW
        document.getElementById('image_file').onchange = function(e) {
            selectedFiles = Array.from(e.target.files).slice(0, 5);
            const container = document.getElementById('image_preview_container');
            container.innerHTML = '';
            selectedFiles.forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    container.innerHTML += `<div class="relative"><img src="${ev.target.result}" class="h-24 w-full object-cover rounded-xl border"></div>`;
                };
                reader.readAsDataURL(f);
            });
        };

        // ADDRESS API (ESGOO)
        const provSelect = document.getElementById('province'), distSelect = document.getElementById('district'), wardSelect = document.getElementById('ward');
        fetch('https://esgoo.net/api-tinhthanh/1/0.htm').then(r => r.json()).then(d => {
            d.data.forEach(p => provSelect.innerHTML += `<option value="${p.id}" data-name="${p.full_name}">${p.full_name}</option>`);
        });
        provSelect.onchange = (e) => {
            distSelect.disabled = !e.target.value; distSelect.innerHTML = '<option>-- Quận/Huyện --</option>';
            if(e.target.value) fetch(`https://esgoo.net/api-tinhthanh/2/${e.target.value}.htm`).then(r => r.json()).then(d => {
                d.data.forEach(p => distSelect.innerHTML += `<option value="${p.id}" data-name="${p.full_name}">${p.full_name}</option>`);
            });
        };
        distSelect.onchange = (e) => {
            wardSelect.disabled = !e.target.value; wardSelect.innerHTML = '<option>-- Phường/Xã --</option>';
            if(e.target.value) fetch(`https://esgoo.net/api-tinhthanh/3/${e.target.value}.htm`).then(r => r.json()).then(d => {
                d.data.forEach(p => wardSelect.innerHTML += `<option value="${p.id}" data-name="${p.full_name}">${p.full_name}</option>`);
            });
        };

        // LOAD DATA EDIT
        if (id) {
            document.getElementById('page-title').innerText = "Cập nhật bài đăng #" + id;
            fetch(`../../api/v1/properties.php?id=${id}`).then(r => r.json()).then(res => {
                const p = res.data;
                document.getElementById('title').value = p.title;
                document.getElementById('price').value = p.price.replace('/tháng', '');
                document.getElementById('type').value = p.type;
                toggleUI(p.type);
                document.getElementById('image_url').value = p.image || '';
                document.getElementById('street').value = p.location || '';
                document.getElementById('area').value = p.area;
                document.getElementById('bed').value = p.bed || 0;
                document.getElementById('wc').value = p.wc || 0;

                if (p.image) {
                    const container = document.getElementById('image_preview_container');
                    p.image.split(',').forEach(url => container.innerHTML += `<img src="${url.trim().replace('/upload/', '/upload/w_200,c_fill/')}" class="h-24 w-full object-cover rounded-xl border">`);
                }
                const setContent = () => tinymce.get('description') ? tinymce.get('description').setContent(p.description || '') : setTimeout(setContent, 100);
                setContent();
            });
        }

        // SUBMIT ACTION
        document.getElementById('bdsForm').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn_submit');
            btn.disabled = true; btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> Đang lưu...';

            let finalImg = document.getElementById('image_url').value;
            if (selectedFiles.length > 0) {
                const formData = new FormData();
                selectedFiles.forEach(f => formData.append('images[]', f));
                const upRes = await fetch('../../api/v1/upload.php', { method: 'POST', body: formData });
                const upData = await upRes.json();
                if (upData.success) finalImg = upData.urls.join(', ');
            }

            const payload = {
                title: document.getElementById('title').value,
                price: typeSelect.value === 'Thuê' ? document.getElementById('price').value + '/tháng' : document.getElementById('price').value,
                type: typeSelect.value,
                location: document.getElementById('street').value,
                image: finalImg,
                description: document.getElementById('description').value,
                legal: legalSelect.value,
                area: document.getElementById('area').value,
                bed: document.getElementById('bed').value,
                wc: document.getElementById('wc').value
            };

            fetch(id ? `../../api/v1/properties.php?id=${id}` : '../../api/v1/properties.php', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(d => {
                alert(d.message); window.location.href = 'index.html';
            }).catch(() => { btn.disabled = false; btn.innerHTML = 'Lưu thông tin'; });
        };
    </script>
</body>
</html>
