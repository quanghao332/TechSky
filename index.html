<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanAnh Home - Trang Bất Động Sản Hàng Đầu Việt Nam</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="/assets/css/global.css">
</head>

<body class="bg-gray-50 text-gray-900">
    <!-- Header Render từ JS -->
    <div id="app-header" class="sticky top-0 z-50"></div>

    <!-- Breadcrumb -->
    <div class="bg-gray-100 py-2">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex text-sm">
                <a href="index.html" class="text-gray-500 hover:text-primary">Trang chủ</a>
                <span class="mx-2 text-gray-400">/</span>
                <span class="text-gray-700">Mua bán</span>
            </nav>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="relative bg-gradient-to-r from-blue-600 to-blue-800 text-white py-20"
        style="background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop'); background-size: cover; background-position: center;">
        <div class="absolute inset-0 bg-blue-900 bg-opacity-60"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <h1 class="text-4xl md:text-6xl font-bold mb-6">Tìm Ngôi Nhà Mơ Ước</h1>
                <p class="text-xl md:text-2xl mb-8 max-w-3xl mx-auto">Khám phá hàng ngàn bất động sản chất lượng cao.
                </p>

                <!-- Hero Search Form -->
                <div class="bg-white rounded-xl p-6 max-w-3xl mx-auto shadow-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2 text-left">Loại bất động
                                sản</label>
                            <select id="hero-type"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-primary">
                                <option value="Bán">BĐS mua</option>
                                <option value="Thuê">BĐS cho thuê</option> <!-- ĐÃ SỬA: Cho thuê -> Thuê -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2 text-left">Mức giá</label>
                            <select id="hero-price"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-primary">
                                <!-- Options nạp tự động bởi home.js -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2 text-left">Vị trí</label>
                            <input type="text" id="hero-location" placeholder="Nhập Thủ Đức..."
                                class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="flex items-end">
                            <button id="hero-search-btn"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 font-semibold rounded-lg transition-colors flex items-center justify-center">
                                <i class="ri-search-line mr-2"></i>Tìm kiếm
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Cột trái: Danh sách BĐS -->
            <div class="flex-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-2xl font-bold mb-6">Bất động sản nổi bật</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="featured-properties">
                        <!-- JS Render dữ liệu vào đây -->
                    </div>

                    <!-- Phân trang (Pagination) -->
                    <div class="flex justify-center items-center mt-12 space-x-2">
                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"><i
                                class="ri-arrow-left-s-line"></i></button>
                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg">1</button>
                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">2</button>
                        <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"><i
                                class="ri-arrow-right-s-line"></i></button>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Sidebar (Nên giữ để Layout cân đối) -->
            <div class="w-full lg:w-80">
                <div class="sticky top-24 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 class="font-bold mb-4 flex items-center"><i class="ri-fire-line text-orange-500 mr-2"></i>
                            Tin nổi bật</h3>
                        <!-- Các tin mini ở đây -->
                        <p class="text-sm text-gray-500">Đang cập nhật...</p>
                    </div>
                    <div class="bg-blue-600 rounded-xl p-6 text-white">
                        <h3 class="font-bold mb-2">Đăng tin miễn phí</h3>
                        <p class="text-sm mb-4 opacity-90">Tiếp cận hàng ngàn khách hàng tiềm năng ngay hôm nay.</p>
                        <button class="w-full bg-white text-blue-600 py-2 rounded-lg font-bold">Đăng ngay</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Render từ JS -->
    <div id="app-footer"></div>

    <script type="module" src="/assets/js/pages/home.js"></script>
</body>

</html>
